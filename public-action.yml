name: Bypass Security Agent
description: Review PR source and replay saved security checks with a pinned Bypass release.
branding:
  icon: shield
  color: purple
inputs:
  github-token:
    description: Repository token for source, check runs and PR summaries.
    required: true
  meta-api-key:
    description: Meta Model API key for source review; unused by smoke replay.
    required: false
  release-id:
    description: Immutable Bypass release ID from the installed package.
    required: true
  operation:
    description: auto, review, or smoke. Use a PR number for manual PR review.
    default: auto
  pr:
    description: Optional PR number for a manual source review.
    required: false
outputs:
  report-directory:
    description: Directory containing the redacted assessment and optional baseline state.
    value: ${{ steps.agent.outputs.report-directory }}
  state-written:
    description: Whether a trusted baseline state was written.
    value: ${{ steps.agent.outputs.state-written }}
  execution:
    description: complete, incomplete, or cancelled.
    value: ${{ steps.agent.outputs.execution }}
  conclusion:
    description: GitHub check conclusion, with explicit report-only policy.
    value: ${{ steps.agent.outputs.conclusion }}
runs:
  using: composite
  steps:
    - id: bundle
      shell: bash
      env:
        BYPASS_RELEASE_ID: ${{ inputs.release-id }}
      run: |
        set -euo pipefail
        [[ "$BYPASS_RELEASE_ID" =~ ^main-[a-f0-9]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]] || {
          echo 'Invalid Bypass release ID' >&2
          exit 1
        }
        base="https://bypasslabs.ai/downloads/bypass/releases/$BYPASS_RELEASE_ID"
        work="$(mktemp -d "$RUNNER_TEMP/bypass-action.XXXXXX")"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 300 "$base/release.json" -o "$work/release.json"
        expected="$(node --input-type=module - "$work/release.json" "$BYPASS_RELEASE_ID" <<'NODE'
        import fs from 'node:fs';
        const manifest=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
        const id=process.argv[3];
        const assets=manifest.assets?.filter(asset=>asset.file==='bypass-linux-x64.tar.gz'&&asset.platform==='linux-x64')??[];
        if(manifest.schemaVersion!==1||manifest.releaseId!==id||manifest.commit!==id.slice(5,45)||assets.length!==1||
          !/^[a-f0-9]{64}$/.test(assets[0].sha256))throw Error('Invalid Bypass release manifest');
        process.stdout.write(assets[0].sha256);
        NODE
        )"
        archive="$work/bypass-linux-x64.tar.gz"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 300 "$base/bypass-linux-x64.tar.gz" -o "$archive"
        printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
        tar -xzf "$archive" -C "$work"
        test -x "$work/bypass/plugin/runtime/node"
        test -f "$work/bypass/plugin/runtime/bin/github-agent.mjs"
        echo "bundle=$work/bypass" >> "$GITHUB_OUTPUT"
    - id: agent
      shell: bash
      env:
        BYPASS_BUNDLE: ${{ steps.bundle.outputs.bundle }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MODEL_API_KEY: ${{ inputs.meta-api-key }}
        BYPASS_GITHUB_OPERATION: ${{ inputs.operation }}
        BYPASS_GITHUB_PR: ${{ inputs.pr }}
      run: '"$BYPASS_BUNDLE/plugin/runtime/node" "$BYPASS_BUNDLE/plugin/runtime/bin/github-agent.mjs"'
