name: Test and publish main downloads
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('bypass-pr-platforms-{0}', github.event.pull_request.number) || 'bypass-main-downloads' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows-accounts:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts
      - name: Build plugin runtime from source
        run: npm run plugin:build
      - name: Verify private account storage and same-session plugin onboarding on Windows
        shell: pwsh
        run: |
          node --test test/credentials.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  macos-terminal:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts
      - name: Build plugin runtime from source
        run: npm run plugin:build
      - name: Verify piped installer hands interactive input to Muse on macOS
        run: |
          python3 scripts/smoke-muse-terminal.py "$(command -v node)"
          python3 scripts/smoke-install-progress.py "$(command -v node)"
  release:
    needs: windows-accounts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    outputs:
      release_id: ${{ steps.build.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Check source and exercise HTTP and Docker regressions
        run: |
          command -v zsh || (sudo apt-get update && sudo apt-get install -y zsh)
          npm ci --ignore-scripts
          npm run check
          BYPASS_DOCKER_TESTS=1 npm test
          python3 scripts/smoke-muse-terminal.py "$(command -v node)"
          python3 scripts/smoke-install-progress.py "$(command -v node)"
          python3 scripts/smoke-terminal-ui.py "$(command -v node)"
      - name: Build self-contained macOS, Linux, and Windows artifacts
        id: build
        run: |
          npm run release:build
          echo "release_id=$(node -p "JSON.parse(require('fs').readFileSync('dist/releases/release.json')).releaseId")" >> "$GITHUB_OUTPUT"
      - name: Archive identical assets in a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:github
      - name: Upload immutable artifacts to R2 with GitHub OIDC
        run: npm run release:upload
      - name: Test the public versioned installer before promotion
        shell: bash
        run: |
          set -euo pipefail
          release="$(node -p "JSON.parse(require('fs').readFileSync('dist/releases/release.json')).releaseId")"
          export BYPASS_RELEASE="$release"
          export BYPASS_INSTALL_DIR="$RUNNER_TEMP/bypass-install"
          export BYPASS_BIN_DIR="$RUNNER_TEMP/bypass-bin"
          export BYPASS_NO_MODIFY_PATH=1
          curl --fail --silent --show-error --location "https://bypasslabs.ai/downloads/bypass/releases/$release/install.sh" | bash
          "$BYPASS_BIN_DIR/bypass" --version
          "$BYPASS_BIN_DIR/bypass" --help
          mkdir -p "$RUNNER_TEMP/bypass-customer-app"
          "$BYPASS_BIN_DIR/bypass" init "$RUNNER_TEMP/bypass-customer-app" --non-interactive
          "$BYPASS_BIN_DIR/bypass" context --project "$RUNNER_TEMP/bypass-customer-app" --task "Add invoice export" --json
          node scripts/smoke-plugin-launch.mjs "$BYPASS_INSTALL_DIR/current" "$RUNNER_TEMP/bypass-customer-app"
          # Exercise PATH using the downloaded package and isolated shell profiles.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {execFileSync} from 'node:child_process';
          const bundle=path.join(process.env.BYPASS_INSTALL_DIR,'current');
          const {configurePath}=await import(pathToFileURL(path.join(bundle,'configure-path.mjs')));
          const expected=JSON.parse(fs.readFileSync(path.join(bundle,'release.json'))).version;
          for(const shell of ['bash','zsh']){
            const profiles=path.join(process.env.RUNNER_TEMP,'bypass-profile-'+shell);
            const result=configurePath({binDir:process.env.BYPASS_BIN_DIR,homeDirectory:profiles,shell,zdotdir:undefined,skip:false});
            assert.deepEqual(result.errors,[]);
            const args=shell==='bash'?['--noprofile','--rcfile',path.join(profiles,'.bashrc'),'-ic','bypass --version']:['-d','-lic','bypass --version'];
            const output=execFileSync('/bin/'+shell,args,{env:{...process.env,PATH:'/usr/bin:/bin',ZDOTDIR:profiles},encoding:'utf8'});
            assert.equal(output.trim(),expected);console.log(shell+' resolves the downloaded Bypass '+expected+' through PATH');
          }
          NODE
  windows:
    needs: release
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Prepare release smoke-test dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Parse the Windows installer and launcher
        shell: powershell
        run: |
          foreach ($file in @('scripts/install.ps1', 'scripts/windows-launcher.ps1', 'scripts/windows-install-test.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Install and verify with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/windows-install-test.ps1 -ReleaseId '${{ needs.release.outputs.release_id }}'
      - name: Install and verify with PowerShell 7
        shell: pwsh
        run: ./scripts/windows-install-test.ps1 -ReleaseId '${{ needs.release.outputs.release_id }}'
  promote:
    needs: [release, windows, macos-terminal]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Load the exact manifest verified by Linux and Windows
        env:
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          mkdir -p dist/releases
          curl -fsSL "https://bypasslabs.ai/downloads/bypass/releases/$RELEASE_ID/release.json" -o dist/releases/release.json
      - name: Atomically promote the complete tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          npm run release:github -- --from-r2 "$RELEASE_ID" --verify
          npm run release:promote
      - name: Verify both public installer entry points
        shell: bash
        run: |
          set -euo pipefail
          export BYPASS_INSTALL_DIR="$RUNNER_TEMP/bypass-install"
          export BYPASS_BIN_DIR="$RUNNER_TEMP/bypass-bin"
          export BYPASS_NO_MODIFY_PATH=1
          curl --fail --silent --show-error --location https://bypasslabs.ai/install | bash
          "$BYPASS_BIN_DIR/bypass" --version
          curl -fsSL https://bypasslabs.ai/install.ps1 -o "$RUNNER_TEMP/install.ps1"
          cmp scripts/install.ps1 "$RUNNER_TEMP/install.ps1"
          node --input-type=module -e "import {buildInstallAssets} from './scripts/build-install-assets.mjs'; buildInstallAssets(process.env.RUNNER_TEMP+'/bootstrap-expected');"
          for pair in 'muse install-muse.sh' 'muse.ps1 install-muse.ps1' 'muse.md install-muse.md'; do
            read -r route file <<< "$pair"
            curl -fsSL "https://bypasslabs.ai/install/$route" -o "$RUNNER_TEMP/$file"
            cmp "$RUNNER_TEMP/bootstrap-expected/$file" "$RUNNER_TEMP/$file"
          done
      - name: Publish the verified GitHub Release after promotion and installer checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: npm run release:github -- --from-r2 "$RELEASE_ID" --publish
