[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bypass-scanner"
version = "0.3.0"
description = "SAST and source-only policy discovery with durable reasoning tasks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bypass-scanner = "bypass_scanner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/bypass-scanner/protocol" = ["protocol/v3.json"]
"share/bypass-scanner/policies" = ["policies/*.json", "policies/*.md"]
