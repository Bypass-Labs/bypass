[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bypass-scanner"
version = "0.2.0"
description = "Deterministic CodeQL discovery with durable signals and MCP integration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bypass-scanner = "bypass_scanner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/bypass-scanner/protocol" = ["protocol/v1.json", "protocol/v2.json"]
